[project]
name = "portfolio-api"
version = "3.0.0.dev0"
description = "FastAPI backend for Jean Claude Ishimwe's portfolio and private owner portal."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.120",
    "uvicorn[standard]>=0.38",
    "pydantic>=2.12",
    "pydantic-settings>=2.11",
    "email-validator>=2.3",
    "sqlalchemy>=2.0.44",
    "psycopg[binary]>=3.2",
    "alembic>=1.17",
    "httpx>=0.28",
    "python-multipart>=0.0.20",
    "pillow>=12.0",
    "argon2-cffi>=25.1",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.14",
    "mypy>=1.18",
    "pip-audit>=2.9",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
# Supply-chain guard: never resolve a release younger than this date. Bump deliberately.
exclude-newer = "2026-10-25T00:00:00Z"

# ---------------------------------------------------------------- quality tools

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle, pyflakes
    "I",             # import order
    "B",             # bugbear
    "UP",            # modern syntax
    "S",             # bandit security rules
    "SIM", "C4", "RET", "PTH", "ASYNC",
    "N",             # naming
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # asserts and literal test secrets are fine in tests

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app", "tests"]
plugins = ["pydantic.mypy"]
exclude = ["^legacy/"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "postgres: needs a real PostgreSQL server at TEST_DATABASE_URL (never skipped silently)",
]
filterwarnings = [
    "error",
    # Starlette's TestClient now prefers the `httpx2` package. We keep the established
    # `httpx` until httpx2 has been reviewed as a dependency; this ignores only that notice.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
